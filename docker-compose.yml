services:
  pg:
    image: postgres:16-alpine
    container_name: codepath-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: 123qweAsd
      POSTGRES_USER: codepath-admin
      POSTGRES_DB: codepath
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    networks:
      - codepath-network
volumes:
  postgres_data:
    driver: local

networks:
  codepath-network:
    driver: bridge
